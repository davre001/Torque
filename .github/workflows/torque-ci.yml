name: Torque CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: torque-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: torque_test
          POSTGRES_USER: torque_test
          POSTGRES_PASSWORD: disposable-fixture-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/ui/package-lock.json
      - name: Install backend test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Backend and isolated PostgreSQL tests
        run: python -m pytest -q --tb=short
        env:
          TORQUE_TEST_DATABASE_URL: postgresql://torque_test:disposable-fixture-password@localhost:5432/torque_test
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend/ui
      - name: Check frontend types
        run: npx tsc --noEmit
        working-directory: frontend/ui
      - name: Verify frontend API proxy
        run: node tests/proxy-contract.cjs
      - name: Build frontend
        run: npm run build
        working-directory: frontend/ui
