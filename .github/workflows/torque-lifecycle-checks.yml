name: Torque Linux lifecycle checks
run-name: Torque Linux lifecycle ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Verification correlation ID (no credentials)
        required: true
        type: string
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixture coordinator dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify real Linux shutdown signals and durable lifecycle
        run: python -m backend.lifecycle_probe
      - name: Verify signal during blocked localhost provider I/O
        run: python -m backend.blocked_shutdown_probe
      - name: Save isolated verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: torque-linux-lifecycle
          path: evidence/lifecycle/**/report.json
          retention-days: 7
          if-no-files-found: error
