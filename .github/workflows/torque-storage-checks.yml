name: Torque PostgreSQL checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  storage:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: torque_test
          POSTGRES_USER: torque_test
          POSTGRES_PASSWORD: disposable-fixture-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/test_postgres_storage.py tests/test_cloud_storage.py -q
        env:
          TORQUE_TEST_DATABASE_URL: postgresql://torque_test:disposable-fixture-password@localhost:5432/torque_test
