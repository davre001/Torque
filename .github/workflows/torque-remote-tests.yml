name: Torque remote tests
run-name: Torque test ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      index_html:
        description: Base64 public kokon site/index.html replacement
        required: false
        type: string
      acceptance_profile:
        description: reduced-motion, gallery-keyboard, or slider-keyboard
        default: reduced-motion
        type: string
      source_repository:
        default: gabrielelozupone/kokon
        type: string
      files_bundle:
        description: Base64 zlib-compressed JSON for reviewed gallery or slider files only
        required: false
        type: string
      repository_setup:
        description: Managed repository test configuration
        required: false
        type: string
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install coordinator dependencies
        run: python -m pip install httpx==0.28.1 pydantic==2.14.0 python-dotenv==1.2.4
      - name: Run isolated acceptance tests
        env:
          PYTHONUNBUFFERED: '1'
          TORQUE_REQUEST_ID: ${{ inputs.request_id }}
          TORQUE_SOURCE_SHA: ${{ inputs.source_sha }}
          TORQUE_INDEX_HTML: ${{ inputs.index_html }}
          TORQUE_ACCEPTANCE_PROFILE: ${{ inputs.acceptance_profile }}
          TORQUE_SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          TORQUE_FILES_BUNDLE: ${{ inputs.files_bundle }}
          TORQUE_REPOSITORY_SETUP: ${{ inputs.repository_setup }}
        run: python -u -m backend.remote_job
      - name: Save machine-readable result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: torque-result-${{ inputs.request_id }}
          path: remote-result/result.json
          retention-days: 1
          if-no-files-found: error
