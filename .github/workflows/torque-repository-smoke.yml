name: Managed Python repository smoke (native wheel regression)
on:
  push:
    branches: [main]
    paths: [.github/workflows/torque-repository-smoke.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-repository:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install httpx==0.28.1 pydantic==2.14.0 python-dotenv==1.2.4
      - name: Validate public Encore backend without credentials
        env:
          PYTHON_DOTENV_DISABLED: '1'
        run: |
          python - <<'PY'
          import base64, json, zlib
          from backend.repository_test_job import execute
          sha = '57a60d8ff5dabfc77c914cc2b883ba24a075e49b'
          config = {'framework':'pytest', 'suite_sha':sha,
                    'test_files':['backend/requirements.txt', 'backend/tests/test_chunked_upload.py',
                                  'backend/tests/test_editor_responsiveness.py', 'backend/tests/test_gemini_video.py',
                                  'backend/tests/test_publish_cors.py', 'backend/tests/test_youtube_publish_dependencies.py'],
                    'editable_files':['backend/app/main.py']}
          bundle = base64.b64encode(zlib.compress(b'{}')).decode()
          result = execute('davre-tech/encore', sha, json.dumps(config), bundle)
          print(result['result']['output'])
          assert result['result']['exit_code'] == 0, 'Managed Python validation failed'
          assert result['result']['assertions_passed'] == 1
          PY
